name: Create Milestone from YAML

on:
  workflow_dispatch:
    inputs:
      milestone_file:
        description: "Path to milestone YAML file"
        required: true
        default: ".github/milestones/milestone-3.yaml"

permissions:
  issues: write
  contents: read

jobs:
  create-milestone:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Create milestone and issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          FILE="${{ inputs.milestone_file }}"

          # --------------------------------------------------
          # Validate input file
          # --------------------------------------------------

          if [ ! -f "$FILE" ]; then
            echo "::error::File not found: $FILE"
            exit 1
          fi

          echo "Using milestone file: $FILE"
          echo ""

          # --------------------------------------------------
          # Read milestone information
          # --------------------------------------------------

          TITLE=$(yq -r '.title' "$FILE")
          DESC=$(yq -r '.description // ""' "$FILE")

          if [ -z "$TITLE" ] || [ "$TITLE" = "null" ]; then
            echo "::error::Milestone title is missing"
            exit 1
          fi

          echo "========================================="
          echo "Creating milestone: $TITLE"
          echo "========================================="

          # --------------------------------------------------
          # Create milestone
          # --------------------------------------------------

          MILESTONE_NUMBER=$(gh api \
            "repos/{owner}/{repo}/milestones" \
            -f title="$TITLE" \
            -f description="$DESC" \
            -f state="open" \
            --jq '.number')

          echo "Created milestone #$MILESTONE_NUMBER"
          echo ""

          # --------------------------------------------------
          # Read number of parent issues
          # --------------------------------------------------

          ISSUE_COUNT=$(yq -r '.issues | length' "$FILE")

          if [ "$ISSUE_COUNT" -eq 0 ]; then
            echo "No issues found in YAML file."
            exit 0
          fi

          echo "Found $ISSUE_COUNT parent issues."
          echo ""

          # --------------------------------------------------
          # Create parent issues
          # --------------------------------------------------

          for i in $(seq 0 $((ISSUE_COUNT - 1))); do

            ISSUE_TITLE=$(yq -r ".issues[$i].title" "$FILE")
            ISSUE_DESC=$(yq -r ".issues[$i].description // \"\"" "$FILE")

            echo "-----------------------------------------"
            echo "Parent issue: $ISSUE_TITLE"
            echo "-----------------------------------------"

            # ----------------------------------------------
            # Build label arguments
            # ----------------------------------------------

            LABEL_COUNT=$(yq -r ".issues[$i].labels // [] | length" "$FILE")

            LABEL_ARGS=()

            if [ "$LABEL_COUNT" -gt 0 ]; then
              for j in $(seq 0 $((LABEL_COUNT - 1))); do
                LABEL=$(yq -r ".issues[$i].labels[$j]" "$FILE")

                if [ -n "$LABEL" ] && [ "$LABEL" != "null" ]; then
                  LABEL_ARGS+=(--label "$LABEL")
                fi
              done
            fi

            # ----------------------------------------------
            # Create parent issue
            # ----------------------------------------------

            PARENT_URL=$(gh issue create \
              --title "$ISSUE_TITLE" \
              --body "$ISSUE_DESC" \
              --milestone "$TITLE" \
              "${LABEL_ARGS[@]}")

            PARENT_NUMBER="${PARENT_URL##*/}"

            echo "Created parent issue #$PARENT_NUMBER"
            echo ""

            # ----------------------------------------------
            # Read child issues
            # ----------------------------------------------

            CHILD_COUNT=$(yq -r ".issues[$i].children // [] | length" "$FILE")

            if [ "$CHILD_COUNT" -eq 0 ]; then
              echo "No child issues."
              echo ""
              continue
            fi

            echo "Creating $CHILD_COUNT sub-issues..."

            # ----------------------------------------------
            # Create child issues
            # ----------------------------------------------

            for j in $(seq 0 $((CHILD_COUNT - 1))); do

              CHILD_TITLE=$(yq -r \
                ".issues[$i].children[$j].title" \
                "$FILE")

              CHILD_DESC=$(yq -r \
                ".issues[$i].children[$j].description // \"\"" \
                "$FILE")

              echo "  Creating sub-issue: $CHILD_TITLE"

              CHILD_URL=$(gh issue create \
                --title "$CHILD_TITLE" \
                --body "$CHILD_DESC" \
                --milestone "$TITLE" \
                --parent "$PARENT_NUMBER")

              CHILD_NUMBER="${CHILD_URL##*/}"

              echo "    -> #$CHILD_NUMBER"
            done

            echo ""
          done

          # --------------------------------------------------
          # Summary
          # --------------------------------------------------

          echo ""
          echo "========================================="
          echo "Milestone creation complete!"
          echo "========================================="
          echo ""
          echo "Milestone: $TITLE"
          echo "Milestone number: #$MILESTONE_NUMBER"
          echo ""

          echo "Issues created:"
          gh issue list \
            --milestone "$TITLE" \
            --state all \
            --limit 100 \
            --json number,title,state \
            --template '{{range .}}#{{.number}} - {{.title}} ({{.state}}){{"\n"}}{{end}}'
