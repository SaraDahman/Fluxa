title: "Milestone 3: Teams"
description: "Team management built on the centralized RBAC permission matrix"

issues:
  - title: "Team management"
    description: |
      Implement team CRUD within a workspace. Teams group members and own projects. Team
      membership is role-free and derived from ProjectMember (no TeamRole enum, no
      membership lifecycle endpoints). All authority is enforced via the permission
      matrix in `server/src/permissions/constants.ts`.
    labels:
      - enhancement
    children:
      - title: "Create team"
        description: |
          Allow workspace admins/owners to create a new team.

          **Endpoints:**
          - `POST /workspaces/:workspaceId/teams`

          **Body:** `{ name: string, description?: string }`

          **Steps:**
          - Create `server/src/modules/teams/` (controller, service, repository, DTOs, routes)
          - Add Zod validation schema for create team
          - Guard with `requireWorkspacePermission(TEAM_CREATE)` (ADMIN/OWNER via matrix)
          - No TeamMember record is created on team creation — membership is derived from ProjectMember
          - Return `{ ...team, members: [] }`

      - title: "View teams"
        description: |
          List all teams in the current workspace. Visible to every workspace member.

          **Endpoints:**
          - `GET /workspaces/:workspaceId/teams`

          **Steps:**
          - Guard with `requireWorkspacePermission(TEAM_VIEW)` (all members via matrix)
          - Return teams with member count
          - Support pagination (offset/limit)

      - title: "View team details"
        description: |
          Open a single team. Restricted to workspace admins/owners only.

          **Endpoints:**
          - `GET /workspaces/:workspaceId/teams/:teamId`

          **Steps:**
          - Guard with `requireWorkspacePermission(TEAM_ACCESS)` (ADMIN/OWNER via matrix)
          - Team membership does NOT grant access — authority comes from the workspace role
          - Return team info + members list + projects list

  - title: "Team permissions & authorization"
    description: |
      Authorization is enforced centrally by the permission matrix and middleware, not by
      a per-team role. Workspace roles are the source of authority for team-scoped actions.
    labels:
      - enhancement
    children:
      - title: "Permission matrix entries"
        description: |
          Add team permissions to the workspace role matrix.

          **Permissions added:**
          | Permission   | Key          | MEMBER | ADMIN/OWNER |
          |--------------|--------------|--------|-------------|
          | View teams   | `team:view`  | ✅     | ✅          |
          | Open team    | `team:access`| ❌     | ✅          |
          | Create team  | `team:create`| ❌     | ✅          |
          | Update team  | `team:update`| ❌     | ✅          |
          | Delete team  | `team:delete`| ❌     | ✅          |

      - title: "Permission middleware"
        description: |
          Enforce team permissions through the shared RBAC middleware.

          **Steps:**
          - Use `requireWorkspacePermission(PERMISSIONS.TEAM_*)` from
            `server/src/middleware/require-permission.middleware.ts`
          - Apply to team routes; return 403 if the caller's resolved workspace access
            lacks the required permission
          - `validate` middleware handles param/body validation; permission middleware
            only reads `req.access` (already resolved permissions)

      - title: "Derived team membership"
        description: |
          Team membership is not stored directly; it is derived from ProjectMember.

          **Steps:**
          - `TeamMember` model is role-free (no `TeamRole` enum; `TeamRole` dropped from schema)
          - Membership is computed from members of the team's projects
          - No add/remove/update-role endpoints — there is no manual membership lifecycle

  - title: "Team update & delete (future work)"
    description: |
      Mutating team operations beyond create. Routes are not yet built; guarded by the
      matrix when they land.
    labels:
      - enhancement
    children:
      - title: "Update team"
        description: |
          Update team info.

          **Endpoints:**
          - `PATCH /workspaces/:workspaceId/teams/:teamId`

          **Body:** `{ name?: string, description?: string }`

          **Steps:**
          - Guard with `requireWorkspacePermission(TEAM_UPDATE)`
          - Update team fields

      - title: "Delete team"
        description: |
          Delete a team. Projects are unlinked, not deleted.

          **Endpoints:**
          - `DELETE /workspaces/:workspaceId/teams/:teamId`

          **Steps:**
          - Guard with `requireWorkspacePermission(TEAM_DELETE)`
          - Delete team and its ProjectMember-derived links (no standalone TeamMember records)
          - Set `teamId = null` on linked projects
